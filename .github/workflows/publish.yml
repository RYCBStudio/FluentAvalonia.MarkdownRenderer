name: publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_SOURCE_GITHUB: https://nuget.pkg.github.com/RYCBStudio/index.json
  NUGET_SOURCE_NUGETORG: https://api.nuget.org/v3/index.json
  PROJECT: FluentAvalonia.MarkdownRender.csproj

jobs:
  build:
    name: build & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build
        run: dotnet build "$PROJECT" -c Release --no-restore

      - name: Resolve package version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -o ./artifacts -p:Version="${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*

  publish-github-packages:
    name: push to GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Push
        run: dotnet nuget push "./artifacts/*.nupkg" --source "$NUGET_SOURCE_GITHUB" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过创建"
          else
            gh release create "$GITHUB_REF_NAME" ./artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
          fi

  publish-nuget-org:
    name: push to nuget.org (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # OIDC：nuget.org 受信发布（Trusted Publishing）用它交换短期 API key
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: RYCBStudio

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --source "$NUGET_SOURCE_NUGETORG" --api-key "$NUGET_API_KEY" --skip-duplicate
